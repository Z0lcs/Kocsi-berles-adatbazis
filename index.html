<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
    <title>🦆Kacsa autóbérlő🦆</title>
</head>
<body>

    <header>
        <h1>Autóbérlés</h1>
        <p>Bérelj álomautót gyorsan és egyszerűen!</p>
    </header>
    
    <div class="urlap-kontener" id="foglalas">
        <h2>Foglalás Leadása</h2>
        <form id="berles-form"> 
            <div class="urlap-csoport">
                <label for="nev">Teljes név:</label>
                <input type="text" id="nev" required>
            </div>
            <div class="urlap-csoport">
                <label for="email">E-mail cím:</label>
                <input type="email" id="email" required>
            </div>
            <div class="urlap-csoport">
                <label for="auto">Választott autó:</label>
                <select id="auto" required>
                    </select>
            </div>
            <div class="urlap-csoport">
                <label for="kezdo">Bérlés kezdete:</label>
                <input type="date" id="kezdo" required>
            </div>
            <div class="urlap-csoport">
                <label for="zaro">Bérlés vége:</label>
                <input type="date" id="zaro" required>
            </div>
            <button type="submit">Foglalás megerősítése</button>
        </form>
    </div>
    
    <div class="container">
        <div class="kartya-kontener" id="auto-lista">
            <p style='color:white; text-align:center;'>Autók betöltése...</p>
        </div>
    </div>
</body>
</html>
